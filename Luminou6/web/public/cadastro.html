<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="shortcut icon"
      href="./imgs/logo.png"
      type="image/x-icon" />
    <title>CADASTRO - EMPRESA</title>
    <link rel="stylesheet" href="./CSS/cadastro.css">
</head>


<body>
    <main class="container_cadastro">
        <div class="cadastro-card">
            
        <div class="imagem">
            <img src="./imgs/logoLogin.png" alt="Logo Luminous6">
            <h1>Comece a monitorar!<h1>
        </div>
        <span>Crie seu cadastro gratuito e integre seus sensores arduino hoje mesmo.</span>

        <div class="Todos">
        <label for="ipt_nome_empresa"> <b>Nome da empresa:</b></label>  
            <input type="text" id="ipt_nome_empresa" PlaceHolder="Baunilhas Outdoor S/A">
        </div>

        <label for="ipt_email_empresa"><b>Email da empresa:</b></label>
        <div class="Todos">
            <input type="text" id="ipt_email_empresa" PlaceHolder="Seu email@provedor.com">
        </div>
        
        <div class="Todos">
            <label for="ipt_cnpj_empresa"><b>Documento Fiscal:</b></label>    
            <input type="text" id="ipt_cnpj_empresa" PlaceHolder="Seu CNPJ ou CPF">
        </div>
        
        <div class="Todos">
            <label for="ipt_senha_empresa"><b>Senha para empresa:</b></label>
            <input type="password" id="ipt_senha_empresa" PlaceHolder="Sua senha">
        </div>

        <i>Sua senha deve conter pelo menos 8 caracteres e possuir caracteres especiais</i>
        <div class="Todos">
            <label for="ipt_senha_confirma_empresa"><b>Confirme sua senha:</b></label>
            <input type="password" id="ipt_senha_confirma_empresa" oninput="verificar()">
        </div>
        
        <div>
            <button class="btn-cadastro" onclick="cadastrar()">Cadastrar</button>
        </div>

        <div id="div_mensagemCadastro"></div>
        
        <div id="div_senha"></div>
        </div>
    </main>
    
    
</body>
</html>
<script>
    function cadastrar() {
        let nome = ipt_nome_empresa.value;
        let email = ipt_email_empresa.value;
        let cnpj = ipt_cnpj_empresa.value;
        let senha = ipt_senha_empresa.value;
        let confirma = ipt_senha_confirma_empresa.value;
        let mensagem = ``;
        
        if (senha.length < 8) {
            alert(`A senha deve conter pelo menos 8 caracteres`);
        }
        if (!senha.includes('!', '@', '#', '*', '_',)) {
            alert(`
            A senha deve conter pelo menos um caractere especial.
            !, @, #, *, _
            `);
        }

        if (nome == `` || email == `` || cnpj == `` || cnpj == `` || senha == ``) {
            mensagem = `<i>Todos os campos devem estar preenchidos</i>`;
        } else {
            alert(`Usuário cadastrado!`);
        }

        div_mensagemCadastro.innerHTML = mensagem;
    }

    function verificar() {
        let senha = ipt_senha_empresa.value;
        let confirma = ipt_senha_confirma_empresa.value;
        let mensagem = ``;

        if (senha != confirma) {
            mensagem = `<span style="color: red;">As senhas não coincidem</span>`;
        }

            // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        cpfServer: cpfVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
    
        div_senha.innerHTML = mensagem;
    }

</script>
