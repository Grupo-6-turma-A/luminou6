<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../CSS/dashvg.css" />
    <link rel="shortcut icon" href="../imgs/logo.png" type="image/x-icon" />
    <title>Visão Geral</title>
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-content">
            <img src="../imgs/logoLuminou6.png" alt="" class="luminou6">
            <ul class="side_items">
                <li class="item-lateral">
                    <a href="">
                        <img src="../imgs/VectorCasa.png" alt="" />
                        <span>Home</span>
                    </a>
                </li>
                <li class="item-lateral">
                    <a href="">
                        <img src="../imgs/VectorLupa.png" alt="" />
                        <span>Visão Geral</span>
                    </a>
                </li>
                <li class="item-lateral">
                    <a href="">
                        <img src="../imgs/vectorCasa2.png" alt="" />
                        <span>Estufas</span>
                    </a>
                </li>
                <li class="item-lateral">
                    <a href="">
                        <img src="../imgs/VectorEstrela.png" alt="" />
                        <span>Sensores</span>
                    </a>
                </li>
                <li class="item-lateral">
                    <a href="">
                        <img src="../imgs/VectorSino.png" alt="" />
                        <span>Alertas</span>
                    </a>
                </li>
                <li class="item-lateral">
                    <a href="">
                        <img src="../imgs/VectorEstrela2.png" alt="" />
                        <span>Configurações</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <main class="main-content">
        <header class="header-pai">
            <div class="div-mae">
                <span class="icon-calendar">📅</span>
                <div class="div-filho">
                    <small>Período</small>
                    <select id="periodo">
                        <option value="24h">Últimas 24 horas</option>
                        <option value="7d">Últimos 7 dias</option>
                    </select>
                </div>
            </div>
            <div class="div-mae">
                <span class="icon-estufa">🏠</span>
                <div class="div-filho">
                    <small>Estufa</small>
                    <select id="periodo">
                        <option value="todas">Todas as estufas</option>
                        <option value="a">Estufa A</option>
                        <option value="b">Estufa B</option>
                    </select>
                </div>
            </div>
        </header>
        <section class="dashboard1">
            <div class="dash-card">
                <div class="card-header-title">
                    <span>☀️</span> <span>PPFD Atual</span>
                </div>
                <div class="card-body-row">
                    <div class="card-main-value">200 <small>µmol/m²/s</small></div>
                </div>
                <span class="card-footer-text">Horário: 14:37</span>
            </div>
            <div class="dash-card">
                <div class="card-header-title">
                    <span>🏠</span> <span>Cobertura dos Dados</span>
                </div>
                <div class="card-main-value">
                    <span>92%</span>
                </div>
                <span class="card-footer-text">Nas últimas 24h</span>
            </div>
            <div class="dash-card">
                <div class="card-header-title">
                    <span>🏠</span> <span>Leituras Suspeitas</span>
                </div>
                <div class="card-main-value">
                    <span>2%</span>
                </div>
                <span class="card-footer-text">Descartados do cálculo</span>
            </div>
            <div class="dash-card">
                <div class="card-header-title">
                    <span>☀️</span> <span>DLI Estimado</span>
                </div>
                <div class="card-body-row">
                    <div class="card-main-value">18,7 <small>mol/m²/s</small></div>
                </div>
                <span class="card-footer-text">Meta 12-20</span>
            </div>
        </section>
        <div class="card">
            <div class="grafico">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </main>
</body>

</html>
<script>
    const linha = document.getElementById("myChart");

    new Chart(linha, {
        type: "line",
        data: {
            labels: ["00:00", "04:00", "08:00", "12:00", "16:00", "20:00"],
            datasets: [
                {
                    label: "Luminosidade",
                    data: [0, 9, 13, 25, 22, 23],
                    borderColor: "#7C8A5C",
                    backgroundColor: "#7C8A5C",
                    borderWidth: 2,
                    tension: 0.5,
                },
            ],
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                },
            },
        },
    });
</script>
