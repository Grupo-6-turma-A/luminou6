<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../imgs/logoLogin.png" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/styleLogin.css">
    <title>Login</title>
</head>
<body>
    <main class="login-container">
    <div class="login-card">
        <div class="imagem">
            <img src="../imgs/logoLogin.png" alt="Logo Luminous6">
            <h1>Login</h1>
        </div>

        <span class="subtitulo"> Entre com seus dados corretamente para acessar o sistema.</span>
        <div>
            <label for="ipt_e-mail"><b>E-mail</b></label>
            <input type="text" id="ipt_e-mail" placeholder="seu-email@provedor.com">
        </div>

       <div class="campo">
    <label for="ipt_senha"><b>Senha</b></label>

           <div class="senha-container">
        <input type="password" id="ipt_senha" placeholder="Crie uma senha forte">

        <button type="button" onclick="mostrarSenha()">
            <img src="../svg/LoginOlho.svg" alt="Mostrar senha">
        </button>
         </div>
        </div>
        
        <span> <a href="cadastro.html" style="color: #7E8863;">Esqueci a senha</a></span>

        <div>
            <button onclick="calcular()">Entrar</button>
        </div>

        <div class="texto-centralizado">
            <span>
                Não tem uma conta?  <a href="cadastro.html" style="color: #7E8863;">Crie uma!</a>
            </span>
        </div>
    </div>
    </main>
</body>
<script>

    function mostrarSenha() {

        if (ipt_senha.type == "password") {

            ipt_senha.type = "text";

        } else {

            ipt_senha.type = "password";

        }

    }


    function login() {

        let email = document.getElementById("ipt_e-mail").value;
        let senha = document.getElementById("ipt_senha").value;

        let indiceArroba = email.indexOf("@");
        let indicePonto = email.indexOf(".");

        let temArroba = email.includes("@");

        let pontoAposArroba =
            indicePonto > indiceArroba;

        let terminaComPonto =
            email.endsWith(".");


        if (
            email == "" ||
            senha == ""
        ) {

            alert("Preencha todos os campos");

        }

        else if (
            !temArroba ||
            !pontoAposArroba ||
            terminaComPonto
        ) {

            alert("Digite um e-mail válido");

        }

        else if (senha.length < 8) {

            alert("A senha precisa ter pelo menos 8 caracteres");

        }

        else {

            alert("Login válido!");

        }

    }

</script>
