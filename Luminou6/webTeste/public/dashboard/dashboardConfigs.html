<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/dashboardConfigs.css">
    <link rel="shortcut icon" href="../imgs/logo.png" type="image/x-icon">

    <title>Configurações</title>
</head>

<body>

    <header>
        <div class="logo">
            <img src="../imgs/logoLuminou6.png" alt="Logo Luminou6">
        </div>

        <nav>
            <div>
                <img src="../imgs/VectorCasa.svg" alt="">
                <a href="../index.html">Home</a>
            </div>

            <div>
                <img src="../imgs/VectorLupa.svg" alt="">
                <a href="dashboardVisaoGeral.html">Visão Geral</a>
            </div>

            <div>
                <img src="../imgs/VectorCasa2.svg" alt="">
                <a href="dashboardEstufa.html">Estufas</a>
            </div>

            <div>
                <img src="../imgs/VectorEstrela.svg" alt="">
                <a href="#">Sensores</a>
            </div>

            <div>
                <img src="../imgs/VectorSino.svg" alt="">
                <a href="#">Alertas</a>
            </div>

            <div class="menu-ativo">
                <img src="../imgs/VectorConfig.svg" alt="">
                <a href="#">Configurações</a>
            </div>
        </nav>
    </header>

    <main class="conteudo">


        <div class="filtro">

            <img
                class="icone-filtro"
                src="../imgs/VectorCasa2.svg"
                alt=""
            >

            <div class="filtro-texto">
                <label for="estufa">Estufa</label>

                <select id="estufa">
                    <option value="1">Estufa 01</option>
                    <option value="2">Estufa 02</option>
                </select>
            </div>

        </div>
        <div class="cabecalho">
            <h1>Configurações</h1>
            <p>Configure os parâmetros da sua estufa.</p>
        </div>

        <div class="secao-config">

            <h2>Parâmetros de cultivo</h2>

            <div class="campo">
                <label for="ppfdMin">PPFD mínimo</label>
                <input type="number" id="ppfdMin" placeholder="Ex.: 200">
            </div>

            <div class="campo">
                <label for="ppfdMax">PPFD máximo</label>
                <input type="number" id="ppfdMax" placeholder="Ex.: 600">
            </div>

            <div class="campo">
                <label for="dli">Meta diária de luz (DLI)</label>
                <input type="number" id="dli" placeholder="Ex.: 20">
            </div>

        </div>

        <div class="secao-config">

            <h2>Notificações</h2>

            <div class="opcao">
                <div>
                    <h3>Alertas dos sensores</h3>
                    <p>Receber avisos quando os parâmetros estiverem fora dos limites.</p>
                </div>

                <input type="checkbox" id="alertas" checked>
            </div>

        </div>

        <div class="botoes">
            <button type="button" class="btn-cancelar">
                Cancelar
            </button>

            <button type="button" class="btn-salvar">
                Salvar alterações
            </button>
        </div>

    </main>

</body>
</html>
