    <h1>Calculadora financeira</h1>
    <label for="inp_estufa">Quantidade de estufas:</label><br>
    <i>É considerado a projeção média de uma estufa pequena tradicional (não adensada) de 50m2</i><br>
    <input type="text" id="inp_estufa"><br><br>
    <label for="inp_obra">Média anual gasta em mão de obra:</label><br>
    <i>Custo de toda mão de obra envolvida no processo</i><br>
    <input type="text" id="inp_obra" placeholder="em R$"><br><br>
    <button onclick="analisar()">Analisar</button><br>
    <div id="div_msg"></div>
</body>
</html>

<script>
   function analisar() {
      let qtdEstufa = Number(inp_estufa.value);
      let custoMaodeobra = Number(inp_obra.value); // valor esperado por ano
      let mediaFavaEstufa = qtdEstufa * 250; // quantidade média de mudas assumida em 10/estufa (tradicional, não adensada) - número de mudas que vai gerar de 200 a 300 favas por ano
      let valorGeradoReais = (mediaFavaEstufa * (450 * 5)) - custoMaodeobra; // custo médio por fava vezes o custo do dólar
      let valorGeradoReaisEstufaAno = valorGeradoReais / qtdEstufa; // valor total médio gerado por uma estufa ao ano já descontado da mão de obra
      let percentualPerda = 0.15; // definindo possiveis perdas em 15%
      let potencialPerda = valorGeradoReaisEstufaAno * percentualPerda; // simulação do prejuizo em caso de problema em x% das estufas
      let potencialPerdaMes = potencialPerda / 12;
      let totalAnual = valorGeradoReaisEstufaAno - potencialPerda;

      let mensagem = ``;

      if (qtdEstufa < 1) {
         alert(`Insira um número de estufas válido`);
      }

      mensagem = `
      Sem Luminou6, você perderia R$${potencialPerda.toFixed(2)} no ano caso apenas ${percentualPerda*100}% das suas estufas tivessem problemas relacionados a temperatura.<br>
      Valores:<br>
      <span style="color: red;">Perda mensal: R$${potencialPerdaMes.toFixed(2)}</span><br>
      Valor final anual: R$${totalAnual.toFixed(2)}
      <br><br>

      <span style="color: green;">Com Luminou6, a projeção de ganhos anuais da sua empresa seria de R$${valorGeradoReaisEstufaAno.toFixed(2)}.</span><br>
      `;

      div_msg.innerHTML = mensagem;

      // input estufas -> madia(media de paltação que rende)  =qtdEstufas  * 0.75(media por fava por ano de 1 estufa) = dinheiro -> media * (450 (media do custo da fava em dolar)* 5,17(dolar)); 
      // input mão ->  maoObra * 12   (calcular o ano)  
      // EstufaUnitaria -> dinheiro / qtdEstufas (ver quanto cada estufa rende separadamente ao ano) + mãoObra 
      // aoMEs = EstufaUnitaria / 12 
      //
      // prejuizo -> dinheiro + mão (ao ano) 
      // economizar ->  dinheiro - mão (ao ano) 
      //
      // Sem luminou 6 - Com qtdEstufas caso de problema em (n) estufas sua empresa perderia um total de R$EstufaUnitaria, sendo uma perda de (aoMEs) por mes a acada estufa perdida. 
      // Com luminou 6 - confiando a segurnaça de sua safra na Luminou 6  o lucro da sua empresa seria de (aoMEs), e (economixs) ao ano
   }
</script>
